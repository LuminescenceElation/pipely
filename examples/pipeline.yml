name: demo

jobs:
  hello:
    steps:
      - name: greet
        run: echo "Hello from Pipely!"

      - name: python_version
        run: python --version

  parallel_demo:
    steps:
      - name: wait_a_bit
        run: bash -lc 'echo "parallel job starting"; sleep 3; echo "parallel job done"'
        timeout_seconds: 10
