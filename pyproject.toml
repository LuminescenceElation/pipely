[project]
name = "pipely"
version = "0.1.0"
description = "A Python CI/CD pipeline orchestrator (local runner + workflow exporter)."
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
]

[project.scripts]
pipely = "pipely.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipely*"]